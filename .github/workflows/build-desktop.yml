name: build-desktop

# FitLife 4.0 桌面版 Windows 产物云端构建
# 触发：推送 v* 标签，或在 Actions 页面手动 Run workflow
# 产物：FitLife-windows-x64-v<版本>.zip（内置裁剪 JRE，解压双击 FitLife.exe 即用）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      app_version:
        description: "产物版本号（写入 exe 与压缩包名）"
        required: false
        default: "4.0.0"
      build_msi:
        description: "同时生成 MSI 安装包（需要 windows runner + WiX）"
        type: boolean
        required: false
        default: false

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  APP_NAME: FitLife
  APP_VERSION: ${{ inputs.app_version || '4.0.0' }}

jobs:
  build-jar:
    name: Build spring boot jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: FitLife-web/package-lock.json

      - name: Build frontend (desktop mode)
        working-directory: FitLife-web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build:desktop || npx vite build --mode desktop
          test -f dist/index.html

      - name: Copy dist into backend static
        run: |
          rm -rf FitLife-java/src/main/resources/static
          mkdir -p FitLife-java/src/main/resources/static
          cp -R FitLife-web/dist/. FitLife-java/src/main/resources/static/

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven package
        working-directory: FitLife-java
        run: mvn -B -ntp -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: fitlife-jar
          path: FitLife-java/target/fitlife-backend-*.jar
          if-no-files-found: error

  package-win:
    name: Build Windows app-image
    needs: build-jar
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: fitlife-jar
          path: build/app

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: jlink trimmed runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $modules = @(
            'java.base','java.logging','java.sql','java.naming','java.desktop',
            'java.management','java.instrument','java.net.http','java.security.jgss',
            'java.transaction.xa','java.xml','java.compiler','java.scripting',
            'jdk.crypto.ec','jdk.crypto.cryptoki','jdk.unsupported','jdk.zipfs','jdk.jfr'
          ) -join ','
          & "$env:JAVA_HOME\bin\jlink.exe" `
            --add-modules $modules `
            --strip-debug `
            --no-header-files `
            --no-man-pages `
            --compress=2 `
            --output build\runtime
          if (-not (Test-Path 'build\runtime\bin\java.exe')) { throw 'jlink 失败' }
          Write-Host ('runtime 大小: {0:N1} MB' -f ((Get-ChildItem build\runtime -Recurse | Measure-Object Length -Sum).Sum / 1MB))

      - name: jpackage app-image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = Get-ChildItem build\app\fitlife-backend-*.jar | Select-Object -First 1
          if (-not $jar) { throw '未找到 fitlife-backend-*.jar' }
          Write-Host "jar: $($jar.Name)"
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type app-image `
            --name $env:APP_NAME `
            --app-version $env:APP_VERSION `
            --vendor "FitLife" `
            --description "FitLife 健康管理 - AI 健身计划" `
            --input build\app `
            --main-jar $jar.Name `
            --main-class org.springframework.boot.loader.launch.JarLauncher `
            --runtime-image build\runtime `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Dspring.profiles.active=desktop" `
            --java-options "-Dfitlife.desktop=1" `
            --java-options "-Djava.awt.headless=false" `
            --java-options "-Xmx768m" `
            --win-console `
            --dest build\dist
          if (-not (Test-Path "build\dist\$env:APP_NAME\$env:APP_NAME.exe")) { throw 'jpackage 未生成 exe' }
          Get-ChildItem "build\dist\$env:APP_NAME" | Select-Object Name, Length

      - name: Zip app-image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "FitLife-windows-x64-v$($env:APP_VERSION).zip"
          Compress-Archive -Path "build\dist\$env:APP_NAME" -DestinationPath "build\$name" -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item "build\$name").Length / 1MB, 1)
          Write-Host "产物: build\$name ($mb MB)"
          "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload app-image
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-windows-x64
          path: build/FitLife-windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Build MSI (optional)
        if: ${{ inputs.build_msi }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type msi `
            --name $env:APP_NAME `
            --app-version $env:APP_VERSION `
            --vendor "FitLife" `
            --input build\app `
            --main-jar (Get-ChildItem build\app\fitlife-backend-*.jar | Select-Object -First 1).Name `
            --main-class org.springframework.boot.loader.launch.JarLauncher `
            --runtime-image build\runtime `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Dspring.profiles.active=desktop" `
            --java-options "-Dfitlife.desktop=1" `
            --win-shortcut --win-menu `
            --dest build\msi

      - name: Upload MSI (optional)
        if: ${{ inputs.build_msi }}
        uses: actions/upload-artifact@v4
        with:
          name: FitLife-windows-x64-msi
          path: build/msi/*.msi
          if-no-files-found: warn
