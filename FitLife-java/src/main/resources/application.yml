server:
  port: 8080

spring:
  # 默认加载 local 档案：本地开发可直接跑，生产部署用 --spring.profiles.active=prod 覆盖
  profiles:
    default: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 一键启动脚本会通过同名环境变量注入数据库凭据；本文件不再保留任何可用口令
    # createDatabaseIfNotExist=true：即使完全没执行 SQL 脚本，后端也能自己建库、建表、灌动作库
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitlife?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASS:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect

# JWT 密钥必须由环境变量注入（至少 32 字节），JwtService 启动时会校验；
# 仓库内不再保留任何默认 secret，避免「拿到源码就能伪造 token」。
jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000  # 7天

# ============================================================
# AI 模型配置
#
# 三家都走 OpenAI 兼容的 /chat/completions，所以换厂商只需改配置，不用改代码。
# API Key 一律从环境变量读（.env / 系统环境变量 / 容器 Secret），没有配置的厂商
# 会在前端模型列表里置灰并给出提示。
#
#   DeepSeek：https://platform.deepseek.com/api_keys    → 变量 DEEPSEEK_API_KEY
#   豆包（火山方舟）：https://console.volcengine.com/ark → 变量 ARK_API_KEY
#   智谱 GLM：https://open.bigmodel.cn/usercenter/apikeys → 变量 ZHIPU_API_KEY
#
# 提示：豆包若在控制台要求「推理接入点」，把下面的 model id 换成 ep-xxxxxxxx 即可。
# ============================================================
ai:
  # 默认模型：没有 DeepSeek Key 时后端会自动回落到第一个已配置的厂商
  default-model: ${AI_DEFAULT_MODEL:deepseek-chat}
  rate-limit: ${AI_RATE_LIMIT:30}        # 每分钟最多请求数（对话 / 计划生成共用）

  providers:
    - id: deepseek
      name: DeepSeek
      api-url: https://api.deepseek.com/chat/completions
      api-key: ${DEEPSEEK_API_KEY:}
      doc-url: https://platform.deepseek.com/api_keys
      models:
        - id: deepseek-chat
          name: DeepSeek V3.2
          tag: 免费额度
          free: true
          note: 通用对话与计划编排，速度快
          max-tokens: 1600
          temperature: 0.6
        - id: deepseek-reasoner
          name: DeepSeek R1
          tag: 推理
          free: true
          note: 复杂问题逐步推理，回答更慢更长
          max-tokens: 2000

    - id: doubao
      name: 豆包
      api-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
      api-key: ${ARK_API_KEY:}
      doc-url: https://console.volcengine.com/ark
      models:
        - id: doubao-seed-1-6-flash
          name: 豆包 Seed 1.6 Flash
          tag: 免费额度
          free: true
          note: 极速低价，日常问答够用
          max-tokens: 1600
          temperature: 0.6
        - id: doubao-seed-1-6
          name: 豆包 Seed 1.6
          tag: 综合
          free: true
          note: 综合能力更强，支持更长上下文
          max-tokens: 2000

    # 兜底厂商：Key 同样只能由环境变量注入（本地开发在 application-local.yml 里配）
    - id: glm
      name: 智谱 GLM
      api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
      api-key: ${ZHIPU_API_KEY:}
      doc-url: https://open.bigmodel.cn/usercenter/apikeys
      models:
        - id: glm-4-flash
          name: GLM-4-Flash
          tag: 免费
          free: true
          note: 免费、响应快，需要配置 ZHIPU_API_KEY
          max-tokens: 1400
          temperature: 0.7
        - id: glm-4.6
          name: GLM-4.6
          tag: 长文本
          free: false
          note: 长文本与代码更强，按量计费
          max-tokens: 2000

# CORS：默认放开给本地演示；部署时用 CORS_ORIGINS 收窄成前端域名，
# 例如 CORS_ORIGINS=https://fitlife.example.com
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}

logging:
  level:
    com.fitlife: ${LOG_LEVEL_FITLIFE:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}